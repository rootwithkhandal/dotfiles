[appearance]
spacing = "compact"

[appearance.themes]
system_theme = false
theme = { custom = { name = "khandal", path = "khandal.yaml" } }

[appearance.vertical_tabs]
enabled = false

[appearance.window]
open_windows_at_custom_size = true
new_windows_num_rows = 35
new_windows_num_columns = 100
override_opacity = 80
backdrop = "acrylic"
left_panel_visibility_across_tabs = false

[appearance.text]
notebook_font_size = 14.0
font_size = 16.0
font_name = "SF Mono"
match_ai_font = true
ai_font_name = "SF Mono"

[appearance.input]
input_mode = "pinned_to_top"

[appearance.full_screen_apps]
alt_screen_padding = { custom = { uniform_padding = 10.0 } }

[general]
default_session_mode = "agent"

[agents]

[agents.third_party]
should_render_cli_agent_toolbar = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "always_ask"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "always_allow"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[warp_drive]
enabled = true

[terminal]

[terminal.input]
input_box_type_setting = "universal"
honor_ps1 = false

[privacy]

[privacy.secret_redaction]
enabled = true

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "enabled"
play_notification_sound = true
